name: Publicar IPA

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter a fonte
        uses: actions/checkout@v4

      - name: Criar a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if [ ! -f HorasSalario.ipa ] || [ ! -f source.json ]; then
            echo "Ainda não há IPA nesta revisão."
            exit 0
          fi
          VERSION=$(python3 -c 'import json; print(json.load(open("source.json"))["apps"][0]["version"])')
          NOTES="Atualização ${VERSION} para o SideStore. Instala por cima da app. Não apagues a instalação."
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" HorasSalario.ipa --clobber
          else
            gh release create "$VERSION" HorasSalario.ipa --title "Horas e Salário ${VERSION}" --notes "$NOTES"
          fi
