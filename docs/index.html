<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nexo</title>
  <link rel="icon" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d12;
      --panel: #14161d;
      --card: #1a1c23;
      --line: rgba(255,255,255,.08);
      --muted: #9aa3ad;
      --text: #f4f6f8;
      --green: #7cdb87;
      --amber: #efc35a;
      --red: #ff6b6b;
      --blue: #6fa8ff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    a { color: var(--green); }
    h2 { margin: 0 0 4px; font-size: 18px; }
    p { margin: 0; }

    /* Shell com navegação lateral compacta */
    .shell { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
    .sidebar { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; padding: 20px 14px; position: sticky; top: 0; height: 100vh; overflow: auto; }
    .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; }
    .brand .logo { width: 34px; height: 34px; border-radius: 9px; background: #0b0d12; overflow: hidden; padding: 0; }
    .brand .logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .brand .eyebrow { color: var(--muted); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
    .brand strong { font-size: 15px; }
    .nav { display: flex; flex-direction: column; gap: 2px; }
    .nav button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: transparent; border: 0; border-radius: 10px; padding: 10px 12px; color: var(--muted); font-weight: 600; }
    .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-items: stretch; margin: 0 0 16px; }
    .tile { background: var(--card); border-radius: 16px; padding: 16px; min-height: 118px; display: flex; flex-direction: column; gap: 6px; }
    .tile .k { color: var(--muted); font-size: 13px; }
    .tile b { font-size: 22px; line-height: 1.2; }
    .tile .s { color: var(--muted); font-size: 12px; margin-top: auto; }
    .item { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 4px; }
    .item + .item { margin-top: 8px; }
    .nav button:hover { background: rgba(255,255,255,.04); color: var(--text); }
    .nav button[aria-pressed="true"] { background: rgba(124,219,135,.14); color: var(--green); }
    .nav .ic { width: 18px; text-align: center; }
    .side-foot { margin-top: auto; border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 8px; }
    .side-foot .who { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ghost { background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; color: var(--text); font-weight: 600; }
    .ghost:hover { border-color: rgba(255,255,255,.28); }

    .content { padding: 22px clamp(16px, 3vw, 40px) 48px; max-width: 1320px; width: 100%; }
    .chead { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 6px; }
    .chead h1 { margin: 0; font-size: 26px; }
    .chead .eyebrow { color: var(--muted); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; margin: 0 0 2px; }
    .monthsel { display: flex; align-items: center; gap: 6px; background: var(--card); border-radius: 999px; padding: 4px; }
    .monthsel .ms-label { min-width: 136px; text-align: center; font-weight: 650; font-size: 14px; }
    .iconbtn { width: 34px; height: 34px; border-radius: 999px; border: 0; background: transparent; color: var(--text); font-size: 16px; display: grid; place-items: center; }
    .iconbtn:hover { background: rgba(255,255,255,.08); }

    .statusbar { display: flex; align-items: center; gap: 10px; margin: 8px 0 14px; font-size: 13px; min-height: 20px; }
    .dot { width: 8px; height: 8px; border-radius: 999px; background: var(--muted); flex: none; }
    .dot.ok { background: var(--green); }
    .dot.warn { background: var(--amber); }
    .dot.err { background: var(--red); }
    .statusbar .msg { color: var(--muted); }
    .statusbar .msg.warn { color: var(--amber); }
    .statusbar .msg.err { color: var(--red); }
    .statusbar .spacer { flex: 1; }

    .card { background: var(--card); border-radius: 16px; padding: 16px; margin: 0 0 16px; }
    .muted { color: var(--muted); }
    .green { background: var(--green); color: #0b0d12; border: 0; border-radius: 12px; padding: 10px 16px; font-weight: 700; }
    .plain { background: transparent; color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font-weight: 600; }
    .plain:hover { border-color: rgba(255,255,255,.28); }
    .danger { background: transparent; color: var(--red); border: 0; font-weight: 650; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
    label.field { display: flex; flex-direction: column; gap: 6px; color: var(--muted); font-size: 13px; flex: 1; min-width: 0; }
    label.field input, label.field select { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 11px; min-width: 0; }

    details.help { margin-top: 6px; }
    details.help summary { cursor: pointer; color: var(--muted); font-size: 13px; list-style: none; }
    details.help summary::-webkit-details-marker { display: none; }
    details.help summary::before { content: "ⓘ "; }
    details.help p { color: var(--muted); font-size: 13px; margin-top: 8px; }

    /* Folha em grelha */
    .folha { display: flex; flex-direction: column; }
    .fhead, .frow { display: grid; grid-template-columns: minmax(52px, 0.7fr) repeat(4, minmax(0, 1fr)) minmax(54px, 0.7fr) minmax(58px, 0.75fr) minmax(108px, 1.2fr); gap: 8px; align-items: center; }
    .fhead { padding: 6px 10px; color: var(--muted); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; }
    .fhead .grp { grid-column: span 2; }
    .frow { padding: 7px 10px; border-radius: 12px; border: 1px solid transparent; }
    .frow + .frow { margin-top: 2px; }
    .frow:hover { background: rgba(255,255,255,.02); }
    .frow.today { border-color: rgba(124,219,135,.4); background: rgba(124,219,135,.06); }
    .frow.folga { background: rgba(111,168,255,.05); }
    .frow.falta { background: rgba(255,107,107,.05); }
    .frow.incompleto { background: rgba(239,195,90,.05); }
    .daycell { display: flex; flex-direction: column; gap: 2px; }
    .daycell .d { font-weight: 700; }
    .daycell .wd { font-size: 11px; color: var(--muted); }
    .cell { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .cell .clab { display: none; font-size: 11px; color: var(--muted); }
    .cell input { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 0 8px; height: 42px; width: 100%; text-align: center; letter-spacing: .02em; }
    .cell input:focus { outline: none; border-color: var(--green); }
    .cell input:disabled { opacity: .4; }
    .tcell { font-variant-numeric: tabular-nums; font-weight: 600; }
    .tcell.sub { color: var(--muted); font-weight: 500; }
    .saldo.pos { color: var(--green); }
    .saldo.neg { color: var(--amber); }
    .actions { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
    .rowstatus { font-size: 12px; color: var(--muted); }
    .rowstatus.warn { color: var(--amber); }
    .rowstatus.err { color: var(--red); }
    .rowstatus.ok { color: var(--green); }
    .savebtn { background: var(--green); color: #0b0d12; border: 0; border-radius: 9px; padding: 7px 12px; font-weight: 700; font-size: 13px; }
    .savebtn[hidden] { display: none; }
    .chip { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px; display: inline-block; }
    .chip.today { background: var(--green); color: #0b0d12; }
    .chip.folga { background: rgba(111,168,255,.18); color: var(--blue); }
    .chip.falta { background: rgba(255,107,107,.18); color: var(--red); }
    .chip.incompleto { background: rgba(239,195,90,.18); color: var(--amber); }
    .chip.domingo { background: rgba(255,255,255,.08); color: var(--muted); }

    .wsum { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin: 16px 0 6px; padding: 8px 12px; background: rgba(255,255,255,.03); border-radius: 10px; }
    .wsum .wk { font-weight: 700; font-size: 14px; }
    .wsum .m { font-size: 13px; color: var(--muted); }
    .wsum .m b { color: var(--text); font-weight: 650; font-variant-numeric: tabular-nums; }
    .wsum .m b.pos { color: var(--green); }
    .wsum .m b.neg { color: var(--amber); }

    /* Quilómetros */
    .km-head, .km-metrics { display: grid; grid-template-columns: 56px minmax(110px,150px) minmax(130px,180px) 90px minmax(220px,1fr); gap: 12px; align-items: start; }
    .km-head { color: var(--muted); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; padding: 10px 0 8px; border-bottom: 1px solid var(--line); }
    .km-row { padding: 12px 0; border-bottom: 1px solid var(--line); }
    .km-day { font-size: 22px; font-weight: 700; line-height: 1.05; }
    .km-final { font-size: 18px; font-weight: 700; }
    .km-head p, .km-metrics p { margin: 0; }
    .fuel { background: rgba(255,255,255,.04); border-radius: 12px; padding: 10px; margin-top: 8px; }
    .fuel .ftitle { font-weight: 650; }

    @media (max-width: 1120px) {
      .shell { grid-template-columns: 1fr; }
      .shell > * { min-width: 0; }
      .sidebar { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px; }
      .brand { padding: 0 8px 0 0; }
      .nav { display: flex; gap: 6px; }
      .nav button { width: auto; padding: 8px 12px; }
      .side-foot { margin: 0 0 0 auto; border: 0; padding: 0; flex-direction: row; align-items: center; }
      .side-foot .who { max-width: 150px; }
    }
    @media (max-width: 800px) {
      .tiles { grid-template-columns: 1fr; }
      .chead h1 { font-size: 22px; }
      .monthsel { flex: 1; justify-content: space-between; }
      .km-head { display: none; }
      .km-metrics { grid-template-columns: 46px 1fr; }
      .km-metrics .span { grid-column: 1 / -1; }
      .fhead { display: none; }
      .folha { gap: 4px; }
      .frow { grid-template-columns: 1fr 1fr; gap: 8px 10px; padding: 12px; background: var(--card); border: 1px solid var(--line); }
      .frow.today { border-color: rgba(124,219,135,.5); }
      .daycell { grid-column: 1 / -1; flex-direction: row; align-items: center; gap: 8px; }
      .cell .clab { display: block; }
      .tcell { grid-column: auto; }
      .tcell::before { content: attr(data-label) " "; color: var(--muted); font-weight: 500; font-size: 11px; display: block; }
      .actions { grid-column: 1 / -1; justify-content: space-between; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="config.js"></script>
  <script>
    const config = window.HORAS_CONFIG || { url: "", key: "" };
    const storageKey = "horas-session";
    const DAILY_REF = 400;              // 6h40 por dia de referência
    const EMPLOYMENT_START = "2026-08-20";
    const state = {
      session: loadSession(),
      records: [],
      tab: "horas",
      year: 0, month: 0,
      status: "", error: "",
      drafts: {},        // { date: {e1,s1,e2,s2} } rascunhos preservados
      rowStatus: {},     // { date: {kind, text} }
      savingDate: null,
      importPlan: null,  // pré-visualização; só grava depois de confirmares
      importBusy: false
    };

    /* ------- sessão e utilidades ------- */
    function loadSession() {
      try { return JSON.parse(localStorage.getItem(storageKey) || "null"); } catch { return null; }
    }
    function saveSession(session) {
      state.session = session;
      if (session) localStorage.setItem(storageKey, JSON.stringify(session));
      else localStorage.removeItem(storageKey);
    }
    function stamp() { return new Date().toISOString().replace(/\.\d{3}Z$/, "Z"); }
    function todayISO() {
      return new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Lisbon", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
    }
    function monthDays(year, month) {
      const count = new Date(Date.UTC(year, month, 0)).getUTCDate();
      return Array.from({ length: count }, (_, i) => `${year}-${String(month).padStart(2, "0")}-${String(i + 1).padStart(2, "0")}`);
    }
    function weekday(iso) {
      const day = new Date(`${iso}T12:00:00Z`).getUTCDay();
      return day === 0 ? 7 : day;
    }
    function weekdayName(iso) { return ["", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb", "Dom"][weekday(iso)]; }
    function dayNumber(iso) { return String(Number(iso.slice(-2))); }
    function addDays(iso, days) {
      const d = new Date(`${iso}T12:00:00Z`);
      d.setUTCDate(d.getUTCDate() + days);
      return d.toISOString().slice(0, 10);
    }
    function mondayOnOrBefore(iso) { return addDays(iso, -(weekday(iso) - 1)); }
    function normalizeClock(raw) {
      const trimmed = (raw || "").trim();
      if (!trimmed) return "";
      const digits = trimmed.replace(/\D/g, "");
      if (trimmed.includes(":") && trimmed.split(":").length === 2) {
        const [h, m] = trimmed.split(":").map(Number);
        if (h > 23 || m > 59 || Number.isNaN(h) || Number.isNaN(m)) return null;
        return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
      }
      if (![1, 2, 3, 4].includes(digits.length) || digits !== trimmed) return null;
      const h = Number(digits.length > 2 ? digits.slice(0, digits.length - 2) : digits);
      const m = digits.length > 2 ? Number(digits.slice(-2)) : 0;
      if (h > 23 || m > 59) return null;
      return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
    }
    function minuteOfDay(clock) { const [h, m] = clock.split(":").map(Number); return h * 60 + m; }
    function hoursText(min) { const s = min < 0 ? "-" : ""; const a = Math.abs(min); return `${s}${Math.floor(a / 60)}h${String(a % 60).padStart(2, "0")}`; }
    function signedHours(min) { return min > 0 ? `+${hoursText(min)}` : hoursText(min); }
    function rows(entity) { return state.records.filter(r => r.entity === entity && !r.payload.deleted_at); }
    function byDate(entity, date) { return rows(entity).filter(r => r.payload.date === date); }

    /* ------- motor de horas (espelho fiel do HoursEngine, só para mostrar) ------- */
    function periodsOf(date) {
      const day = byDate("work_days", date)[0];
      const list = rows("work_periods")
        .filter(r => r.payload.work_day_id === day?.entity_id)
        .sort((a, b) => String(a.payload.start_clock).localeCompare(String(b.payload.start_clock)));
      return { day, list };
    }
    function storedFields(date) {
      const { day, list } = periodsOf(date);
      const v = ["", "", "", ""];
      list.slice(0, 2).forEach((period, i) => {
        v[i * 2] = period.payload.start_clock || "";
        v[i * 2 + 1] = period.payload.end_clock || "";
      });
      return { e1: v[0], s1: v[1], e2: v[2], s2: v[3], day, list };
    }
    function dayResult(date) {
      const { day, list } = periodsOf(date);
      const sunday = weekday(date) === 7;
      const isOff = day?.payload.is_day_off ? true : false;
      const isAbsence = day?.payload.is_absence ? true : false;
      // Períodos incompletos (ex.: vindos do telemóvel) bloqueiam os totais.
      const incomplete = list.some(p => !p.payload.start_clock || !p.payload.end_clock);
      let worked = 0;
      for (const p of list) {
        if (!p.payload.start_clock || !p.payload.end_clock) continue;
        const start = minuteOfDay(p.payload.start_clock);
        let end = minuteOfDay(p.payload.end_clock);
        if (p.payload.ends_next_day || end <= start) end += 1440;
        worked += end - start;
      }
      let stateName, delta, counts;
      if (isOff) { stateName = "folga"; worked = 0; counts = true; delta = sunday ? 0 : -DAILY_REF; }
      else if (isAbsence) { stateName = "falta"; worked = 0; counts = true; delta = sunday ? 0 : -DAILY_REF; }
      else if (incomplete) { stateName = "incompleto"; counts = false; delta = 0; }
      else if (list.length === 0) { stateName = "porPreencher"; worked = 0; counts = true; delta = 0; }
      else if (sunday) { stateName = "preenchido"; counts = true; delta = worked; }
      else { stateName = "preenchido"; counts = true; delta = worked - DAILY_REF; }
      return { date, sunday, state: stateName, worked, delta, counts };
    }

    /* ------- rede: autenticação, leitura e gravação (inalterado) ------- */
    function accountError(status, data) {
      const code = String(data?.error_code || data?.msg || data?.message || "");
      if (code.includes("weak_password") || String(data?.msg || "").includes("at least 6")) return "A palavra-passe tem de ter pelo menos 6 caracteres.";
      if (code.includes("already")) return "Já existe uma conta com esse email. Usa Entrar.";
      if (status === 429 || code.includes("rate")) return "O servidor não enviou o email de confirmação. Espera cerca de uma hora ou desliga Confirm email no projeto e tenta outra vez.";
      return data?.msg || data?.message || data?.error_description || `O servidor respondeu ${status}.`;
    }
    async function api(path, method, token, body) {
      const response = await fetch(config.url + path, {
        method,
        headers: { apikey: config.key, Authorization: `Bearer ${token || config.key}`, "Content-Type": "application/json" },
        body: body ? JSON.stringify(body) : undefined
      });
      const t = await response.text();
      const data = t ? JSON.parse(t) : null;
      if (response.status === 401) throw new Error("A sessão expirou. Entra outra vez.");
      if (!response.ok) throw new Error(accountError(response.status, data));
      return data;
    }
    function sessionFrom(data, email) {
      if (!data?.access_token || !data.user?.id) return null;
      return { userID: data.user.id, email: data.user.email || email, accessToken: data.access_token, refreshToken: data.refresh_token, expiresAt: Date.now() + (data.expires_in || 3600) * 1000 };
    }
    async function ensureSession() {
      if (!state.session) return;
      if (Date.now() < state.session.expiresAt - 60000) return;
      const data = await api("/auth/v1/token?grant_type=refresh_token", "POST", null, { refresh_token: state.session.refreshToken });
      const renewed = sessionFrom(data, state.session.email);
      if (!renewed) throw new Error("A sessão expirou. Entra outra vez.");
      saveSession(renewed);
    }
    async function loadRecords() {
      await ensureSession();
      const data = await api("/rest/v1/horas_records?select=entity,entity_id,payload,revision", "GET", state.session.accessToken);
      state.records = (data || []).map(r => ({ ...r, payload: r.payload || {} }));
    }
    async function putRecord(entity, id, payload, baseRevision) {
      const revision = payload.updated_at;
      const operationID = `${entity}|${id}|${revision}`;
      const result = await api("/rest/v1/rpc/horas_put", "POST", state.session.accessToken, {
        p_operation_id: operationID, p_entity: entity, p_entity_id: id, p_payload: payload, p_revision: revision, p_base_revision: baseRevision || ""
      });
      if (result?.status === "conflict") throw new Error("O iPhone alterou este registo entretanto. Atualiza e volta a escrever.");
      if (result?.status !== "stored") throw new Error("A conta não confirmou este registo.");
      await loadRecords();
      const saved = state.records.find(r => r.entity === entity && r.entity_id === id);
      if (!saved || saved.revision !== revision) throw new Error("A conta não devolveu o registo enviado.");
    }

    /* ------- layout principal ------- */
    const SECTIONS = [
      { id: "resumo", label: "Resumo", icon: "⌂", title: "Resumo", eyebrow: "Visão do mês" },
      { id: "horas", label: "Folha", icon: "▦", title: "Folha mensal", eyebrow: "Controlo mensal" },
      { id: "km", label: "Quilómetros", icon: "⬍", title: "Quilómetros", eyebrow: "Registo da carrinha" },
      { id: "fornecimentos", label: "Fornecimentos", icon: "▢", title: "Fornecimentos", eyebrow: "Materiais e destinos" },
      { id: "planeador", label: "Planeador", icon: "▦", title: "Planeador", eyebrow: "Semana" },
      { id: "tarefas", label: "Tarefas", icon: "✓", title: "Tarefas", eyebrow: "O que falta fazer" },
      { id: "fornecedores", label: "Fornecedores", icon: "◇", title: "Fornecedores", eyebrow: "Contactos" },
      { id: "salario", label: "Salário", icon: "€", title: "Salário", eyebrow: "Valores gravados" },
      { id: "relatorios", label: "Relatórios", icon: "↗", title: "Relatórios", eyebrow: "Documento do mês" },
      { id: "definicoes", label: "Definições", icon: "⚙", title: "Definições", eyebrow: "Conta" }
    ];
    const MONTHS = ["", "Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];

    function render() {
      const root = document.getElementById("root");
      root.replaceChildren();
      if (!config.url.startsWith("https://") || !config.key || config.key.includes("service_role") || config.key.includes("sb_secret_")) {
        root.append(centered(card(p("Esta página ainda não tem o projeto da conta. Abre a app no iPhone."))));
        return;
      }
      if (!state.session) { root.append(centered(loginCard())); return; }
      const now = todayISO();
      if (!state.year) { state.year = Number(now.slice(0, 4)); state.month = Number(now.slice(5, 7)); }

      const shell = div("shell");
      shell.append(sidebar(), content());
      root.append(shell);
    }

    function centered(node) {
      const wrap = div("content");
      wrap.style.maxWidth = "520px";
      wrap.style.margin = "48px auto";
      wrap.append(node);
      return wrap;
    }

    function sidebar() {
      const bar = div("sidebar");
      const brand = div("brand");
      const logo = div("logo");
      const img = document.createElement("img");
      img.src = "nexo-icon.png";
      img.alt = "Nexo";
      logo.append(img);
      brand.append(logo);

    async function auth(kind, emailField, passwordField, note) {
      note.textContent = "";
      try {
        const email = emailField.value.trim();
        const password = passwordField.value;
        if (kind === "recover") { await api("/auth/v1/recover", "POST", null, { email }); note.textContent = "Se existir uma conta com esse email, chega uma mensagem para definir outra palavra-passe."; return; }
        const path = kind === "up" ? "/auth/v1/signup" : "/auth/v1/token?grant_type=password";
        const data = await api(path, "POST", null, { email, password });
        const session = sessionFrom(data, email);
        if (!session) { note.textContent = "A conta foi criada. Confirma o email antes de entrar."; return; }
        saveSession(session);
        await refresh();
      } catch (error) { note.textContent = error.message; }

    /* ------- Importação JSON (mesmo formato da app iOS) ------- */
    function pickImportFile() {
      const input = document.createElement("input");
      input.type = "file";
      input.accept = "application/json,.json";
      input.addEventListener("change", async () => {
        const file = input.files && input.files[0];
        if (!file) return;
        try {
          const text = await file.text();
          const object = JSON.parse(String(text).replace(/^\uFEFF/, ""));
          state.importRaw = object;
          state.importPlan = buildImportPlan(object);
          state.error = "";
          state.status = "Pré-visualização pronta. Nada foi gravado.";
        } catch (error) {
          state.importPlan = null;
          state.error = error.message || "O ficheiro não é uma exportação reconhecida.";
        }
        render();
      });
      input.click();
    }
    function buildImportPlan(object) {
      const format = object && object.format;
      if (format !== "horas-e-salario-export" && format !== "horas-e-salario-ios") {
        throw new Error(format ? `O ficheiro é «${format}» e esta página não o reconhece.` : "O ficheiro não é uma exportação reconhecida.");
      }
      const tables = object.tables || {};
      const days = (tables.work_days || []).filter(row => !row.deleted_at);
      const periods = (tables.work_periods || []).filter(row => !row.deleted_at && row.start_clock && row.end_clock);
      const dayById = Object.fromEntries(days.map(row => [row.id, row]));
      const byDay = {};
      for (const row of days) byDay[row.date] = { day: row, periods: [] };
      let review = null;
      for (const period of periods) {
        const day = dayById[period.work_day_id];
        if (!day || !byDay[day.date]) continue;
        if (day.date === "2026-09-02" && period.start_clock === "18:30") {
          review = { date: day.date, start: period.start_clock, fileEnd: period.end_clock, alternateEnd: period.end_clock === "00:00" ? "22:00" : "00:00", period };
          continue;
        }
        byDay[day.date].periods.push(period);
      }
      const existingPeriods = rows("work_periods");
      let ready = 0, duplicates = 0, conflicts = 0;
      const items = [];
      for (const date of Object.keys(byDay).sort()) {
        const entry = byDay[date];
        const liveDay = byDate("work_days", date)[0];
        const liveList = liveDay
          ? existingPeriods.filter(r => r.payload.work_day_id === liveDay.entity_id)
          : [];
        const classified = entry.periods.map(period => {
          const same = liveList.find(r => r.payload.start_clock === period.start_clock && r.payload.end_clock === period.end_clock);
          if (same) { duplicates += 1; return { period, kind: "duplicate" }; }
          const clash = liveList.find(r => r.payload.start_clock === period.start_clock && r.payload.end_clock !== period.end_clock);
          if (clash) { conflicts += 1; return { period, kind: "conflict", existingEnd: clash.payload.end_clock }; }
          ready += 1;
          return { period, kind: "ready" };
        });
        items.push({ date, day: entry.day, classified, editing: !!state.drafts[date] });
      }
      return { items, review, choice: null, ready, duplicates, conflicts, name: object.source?.origin || format };
    }
    function importCard() {
      const plan = state.importPlan;
      const box = card();
      box.append(h2("Importar JSON"));
      box.append(p("A gravação só acontece depois de confirmares. Os campos que estás a editar não são substituídos. Uma segunda importação não duplica períodos iguais.", "muted"));
      box.append(p(`${plan.ready} períodos prontos · ${plan.duplicates} duplicados · ${plan.conflicts} conflitos`, "muted"));
      if (plan.review) {
        const item = plan.review;
        box.append(p(`02/09 ${item.start}. No ficheiro: ${item.fileEnd}. A outra leitura: ${item.alternateEnd}.`, "muted"));
        box.append(p("22:00 é a base Brave. 00:00 é o PDF original. Nenhuma é aplicada sozinha.", "muted"));
        const row = div("row");
        row.append(
          button("Conferir 22:00", plan.choice === "22:00" ? "green" : "plain", () => { plan.choice = "22:00"; render(); }),
          button("Conferir 00:00", plan.choice === "00:00" ? "green" : "plain", () => { plan.choice = "00:00"; render(); })
        );
        box.append(row);
      }
      const actions = div("row");
      const save = button(state.importBusy ? "A guardar…" : "Gravar na conta", "green", () => applyImport());
      save.disabled = state.importBusy || (plan.review && !plan.choice);
      actions.append(save, button("Cancelar", "plain", () => { state.importPlan = null; render(); }));
      box.append(actions);
      return box;
    }
    async function applyImport() {
      const plan = state.importPlan;
      if (!plan || state.importBusy) return;
      if (plan.review && !plan.choice) {
        state.error = "02/09 ainda está por conferir. Escolhe 22:00 ou 00:00 antes de gravar.";
        render();
        return;
      }
      state.importBusy = true;
      state.status = "A guardar…";
      state.error = "";
      render();
      let stored = 0, skipped = 0;
      try {
        await ensureSession();
        for (const item of plan.items) {
          if (state.drafts[item.date]) { skipped += 1; continue; }
          const ready = item.classified.filter(c => c.kind === "ready").map(c => c.period);
          await importOneDay(item.day, ready, item.date);
          stored += ready.length;
        }
        if (plan.review && plan.choice) {
          const day = plan.items.find(i => i.date === "2026-09-02")?.day;
          if (day && !state.drafts["2026-09-02"]) {
            const period = { ...plan.review.period, end_clock: plan.choice, ends_next_day: plan.choice === "00:00" ? 1 : 0 };
            await importOneDay(day, [period], "2026-09-02");
            stored += 1;
          }
        }
        const raw = state.importRaw;
        state.importPlan = null;
        state.importRaw = null;
        const extra = await importCompanion(raw);
        state.status = "Alterações guardadas na conta.";
        await refresh();
        state.status = `Alterações guardadas na conta. ${stored} períodos importados${extra ? `, ${extra} outros registos` : ""}${skipped ? `, ${skipped} dias em edição mantidos` : ""}.`;
      } catch (error) {
        state.error = error.message;
        state.status = "";
      }
      state.importBusy = false;
      render();
    }
    async function importOneDay(dayRow, periods, date) {
      const now = stamp();
      let dayRecord = byDate("work_days", date)[0];
      const off = dayRow.is_day_off ? 1 : 0;
      const absence = dayRow.is_absence ? 1 : 0;
      const sunday = weekday(date) === 7;
      if (!dayRecord) {
        const id = dayRow.id;
        await putRecord("work_days", id, {
          id, date, is_day_off: off, is_absence: absence,
          sunday_unlocked: sunday && !off && !absence ? 1 : 0,
          notes: dayRow.notes || "",
          created_at: dayRow.created_at || now, updated_at: now, deleted_at: null
        }, "");
        dayRecord = state.records.find(r => r.entity === "work_days" && r.entity_id === id);
      } else if ((dayRecord.payload.is_day_off ? 1 : 0) !== off || (dayRecord.payload.is_absence ? 1 : 0) !== absence) {
        await putRecord("work_days", dayRecord.entity_id, {
          ...dayRecord.payload, is_day_off: off, is_absence: absence, notes: dayRow.notes || dayRecord.payload.notes || "", updated_at: now
        }, dayRecord.revision);
        dayRecord = state.records.find(r => r.entity === "work_days" && r.entity_id === dayRecord.entity_id);
      }
      const live = rows("work_periods").filter(r => r.payload.work_day_id === dayRecord.entity_id);
      for (const period of periods) {
        const start = period.start_clock;
        const end = period.end_clock;
        if (live.some(r => r.payload.start_clock === start && r.payload.end_clock === end)) continue;
        if (live.some(r => r.payload.start_clock === start && r.payload.end_clock !== end)) continue;
        const endsNext = period.ends_next_day || (end && start && minuteOfDay(end) <= minuteOfDay(start)) ? 1 : 0;
        const id = period.id;
        await putRecord("work_periods", id, {
          id, work_day_id: dayRecord.entity_id, start_clock: start, end_clock: end, ends_next_day: endsNext,
          start_instant: period.start_instant || lisbonInstant(date, start, 0),
          end_instant: period.end_instant || lisbonInstant(date, end, endsNext),
          created_at: period.created_at || now, updated_at: now, deleted_at: null
        }, "");
      }
    }

    async function importCompanion(object) {
      if (!object || !object.tables) return 0;
      const entities = ["mileage_readings", "fuel_entries", "day_notes", "tasks", "task_items", "locations", "units", "materials", "destinations", "suppliers", "supply_deliveries", "supply_items", "stock_movements", "work_plan"];
      let added = 0;
      for (const entity of entities) {
        for (const row of object.tables[entity] || []) {
          if (!row || !row.id || row.deleted_at) continue;
          if (state.records.some(r => r.entity === entity && r.entity_id === row.id)) continue;
          const payload = { ...row };
          if (!payload.updated_at) payload.updated_at = payload.created_at || stamp();
          try {
            await putRecord(entity, row.id, payload, "");
            added += 1;
          } catch (error) {
            const message = String(error.message || "");
            if (message.includes("404") || message.includes("entidade") || message.includes("PGRST")) break;
            throw error;
          }
        }
      }
      return added;
    }

    function named(entity, id) {
      if (!id) return "—";

      return row?.payload?.name || "—";

    function monthPrefix() { return `${state.year}-${String(state.month).padStart(2, "0")}`; }
    function monthKilometers() {
      const prefix = monthPrefix();
      const list = rows("mileage_readings")
        .map(r => ({ date: r.payload.date, km: Number(r.payload.kilometers) }))
        .filter(r => r.date && Number.isFinite(r.km))
        .sort((a, b) => a.date.localeCompare(b.date));
      let total = 0;
      for (let i = 0; i < list.length - 1; i += 1) {
        if (!String(list[i].date).startsWith(prefix)) continue;
        const distance = list[i + 1].km - list[i].km;
        if (distance > 0) total += distance;
      }
      return total;
    }
    function settingsRow() { return rows("settings")[0]?.payload || {}; }

    function renderResumo(main) {
      const asOf = isCurrentMonth() ? todayISO() : null;
      const days = monthDays(state.year, state.month).filter(d => d >= EMPLOYMENT_START && (!asOf || d <= asOf));
      let worked = 0, balance = 0, workedDays = 0, incomplete = 0;
      for (const date of days) {
        const result = dayResult(date);
        if (result.state === "incompleto" || !result.counts) incomplete += 1;
        if (result.counts) { worked += result.worked; balance += result.delta; }
        if (result.worked > 0 && result.state !== "folga" && result.state !== "falta") workedDays += 1;
      }
      const grid = div("tiles");
      grid.append(
        tile("Horas este mês", hoursText(worked), `${workedDays} dias com registo`),
        tile("Saldo de horas extra", signedHours(balance), "6h40/dia · domingo à parte"),
        tile("Quilómetros", `${monthKilometers()} km`, "Percorridos no mês"),
        tile("Incompletos", String(incomplete), "Precisam de atenção")
      );
      main.append(grid);
      const box = card(h2("Últimos dias"));
      const recent = days.slice(-7);
      if (!recent.length) box.append(emptyNote("Ainda não há dias neste mês."));
      for (const date of recent) {
        const result = dayResult(date);

        item.append(el("strong", `${dayNumber(date)} ${weekdayName(date)}`), p(`${hoursText(result.worked)} · ${signedHours(result.delta)}`, "muted"));

    function printMonth() {

        const stored = storedFields(date);

      }).join("");
      const km = rows("mileage_readings").filter(r => String(r.payload.date || "").startsWith(prefix));

        <style>body{font-family:Helvetica,Arial,sans-serif;color:#111;margin:32px}h1{font-size:22px;margin:0}p{color:#444}table{width:100%;border-collapse:collapse;margin-top:16px}th,td{border-bottom:1px solid #ddd;text-align:left;padding:6px 4px;font-size:12px}th{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:#555}.sign{margin-top:48px;display:flex;gap:48px}.sign div{flex:1;border-top:1px solid #222;padding-top:8px}</style></head>
        <body><p>NEXO</p><h1>Folha de ponto · ${MONTHS[state.month]} ${state.year}</h1><p>${settingsRow().company_name || ""} ${settingsRow().person_name || ""}</p>
        <table><thead><tr><th>Dia</th><th>Entrada 1</th><th>Saída 1</th><th>Entrada 2</th><th>Saída 2</th><th>Horas</th><th>Saldo</th></tr></thead><tbody>${lines}</tbody></table>
        <h2>Quilómetros</h2><p>${km.map(r => `${br(r.payload.date)} · ${r.payload.kilometers} km`).join("<br>") || "Sem leituras neste mês."}</p>
        <h2>Fornecimentos</h2><p>${supplies.map(r => `${br(r.payload.date)} · ${named("destinations", r.payload.destination_id)}`).join("<br>") || "Sem fornecimentos neste mês."}</p>
        <div class="sign"><div>Assinatura do trabalhador</div><div>Assinatura da empresa</div></div></body></html>`;
      const frame = document.createElement("iframe");
      frame.style.position = "fixed";
      frame.style.right = "0";
      frame.style.bottom = "0";
      frame.style.width = "0";
      frame.style.height = "0";
      frame.style.border = "0";

      frame.contentDocument.open();
      frame.contentDocument.write(html);
      frame.contentDocument.close();

    }

    function renderSettings(main) {
      const settings = settingsRow();
      const box = card(h2("Identificação"));
      box.append(p(settings.company_name || "Empresa por preencher", "muted"));
      box.append(p(settings.person_name || "Nome por preencher", "muted"));
      box.append(p(settings.company_nif ? `NIF ${settings.company_nif}` : "NIF por preencher", "muted"));
      box.append(p("A importação JSON fica em Importar JSON, no fundo da barra. A gravação só acontece depois de confirmares, e 02/09 pede 22:00 ou 00:00.", "muted"));

    }

    /* ------- Folha ------- */
    function renderHours(main) {
      const box = card();
      const bar = div("row");
      bar.style.justifyContent = "space-between";
      bar.append(h2("Folha mensal"));
      box.append(bar);
      const help = el("details", null);
      help.className = "help";
      const sum = document.createElement("summary"); sum.textContent = "Como preencher";
      help.append(sum, p("Escreve as horas no próprio dia: 0830 passa a 08:30 e o Tab avança pelas colunas e depois para o dia seguinte. Uma saída menor ou igual à entrada termina no dia seguinte. O dia por preencher não recebe débito automático; folga ou falta de segunda a sábado descontam 6h40; domingo trabalhado conta à parte."));
      box.append(help);

      const table = div("folha");
      table.append(folhaHead());

      const asOf = isCurrentMonth() ? todayISO() : null;
      const days = monthDays(state.year, state.month).filter(d => d >= EMPLOYMENT_START);
      let currentWeek = null;
      for (const date of days) {
        const wk = mondayOnOrBefore(date);
        if (wk !== currentWeek) {
          currentWeek = wk;
          const weekDays = days.filter(d => mondayOnOrBefore(d) === wk);
          table.append(weekSummary(wk, weekDays, asOf));
        }
        table.append(folhaRow(date, asOf));
      }
      box.append(table);
      main.append(box);
    }

    function folhaHead() {
      const head = div("fhead");
      head.append(
        div("", text("Dia")),
        div("", text("Entrada 1")), div("", text("Saída 1")),
        div("", text("Entrada 2")), div("", text("Saída 2")),
        div("", text("Horas")), div("", text("Saldo")),
        div("", text("Estado / ação"))
      );
      return head;
    }

    function weekSummary(monday, weekDays, asOf) {
      const sunday = addDays(monday, 6);
      let worked = 0, target = 0, balance = 0;
      for (const date of weekDays) {
        if (asOf && date > asOf) continue;
        const r = dayResult(date);
        if (weekday(date) !== 7 && date >= EMPLOYMENT_START) target += DAILY_REF;
        if (r.counts) { worked += r.worked; balance += r.delta; }
      }
      const node = div("wsum");
      node.append(div("wk", text(`Semana de ${br(monday)} a ${br(sunday)}`)));
      node.append(metric("Trabalhado", hoursText(worked)));
      node.append(metric("Referência", hoursText(target)));
      node.append(metric("Saldo", signedHours(balance), balance > 0 ? "pos" : (balance < 0 ? "neg" : "")));
      return node;
    }
    function metric(label, value, cls) {
      const m = div("m");
      m.append(document.createTextNode(label + " "));
      const b = el("b", value);
      if (cls) b.className = cls;
      m.append(b);
      return m;
    }
    function br(iso) { const [y, mo, d] = iso.split("-"); return `${d}/${mo}`; }

    function folhaRow(date, asOf) {
      const stored = storedFields(date);
      const result = dayResult(date);
      const isToday = date === todayISO();
      const locked = result.state === "folga" || result.state === "falta";
      const draft = state.drafts[date];
      const vals = draft || { e1: stored.e1, s1: stored.s1, e2: stored.e2, s2: stored.s2 };

      const rowCls = ["frow"];
      if (isToday) rowCls.push("today");
      if (["folga", "falta", "incompleto"].includes(result.state)) rowCls.push(result.state);
      const row = div(rowCls.join(" "));

      // Dia
      const daycell = div("daycell");
      const dl = div("d"); dl.textContent = `${dayNumber(date).padStart(2, "0")}`;
      const wd = div("wd"); wd.textContent = weekdayName(date);
      const left = div(""); left.append(dl, wd);
      daycell.append(left);
      const chip = stateChip(result, isToday);
      if (chip) daycell.append(chip);
      row.append(daycell);

      // 4 campos
      const fields = {};
      [["e1", "Entrada 1"], ["s1", "Saída 1"], ["e2", "Entrada 2"], ["s2", "Saída 2"]].forEach(([key, label]) => {
        const cell = div("cell");
        const clab = document.createElement("span"); clab.className = "clab"; clab.textContent = label;
        const f = document.createElement("input");
        f.type = "text"; f.inputMode = "numeric"; f.placeholder = "08:30"; f.maxLength = 5;
        f.value = vals[key] || "";
        f.disabled = locked;
        f.setAttribute("aria-label", `${label} de ${br(date)}`);
        f.addEventListener("input", () => onFieldInput(date, fields, row));
        f.addEventListener("blur", () => { const n = normalizeClock(f.value); if (n !== null && n !== "") f.value = n; onFieldInput(date, fields, row); });
        cell.append(clab, f);
        fields[key] = f;
        row.append(cell);
      });

      // Horas, Saldo
      const horas = div("tcell"); horas.setAttribute("data-label", "Horas");
      horas.textContent = (result.state === "folga" || result.state === "falta" || result.state === "porPreencher" || result.state === "incompleto") ? "—" : hoursText(result.worked);
      row.append(horas);

      const included = !asOf || date <= asOf;
      const saldo = div("tcell saldo"); saldo.setAttribute("data-label", "Saldo");
      if (!included || result.state === "porPreencher" || result.state === "incompleto") saldo.textContent = "—";
      else { saldo.textContent = signedHours(result.delta); if (result.delta > 0) saldo.classList.add("pos"); else if (result.delta < 0) saldo.classList.add("neg"); }
      row.append(saldo);

      // Estado / ação
      const actions = div("actions");
      const rowStatus = div("rowstatus");
      const saveBtn = document.createElement("button");
      saveBtn.className = "savebtn"; saveBtn.textContent = "Guardar"; saveBtn.tabIndex = -1;
      saveBtn.addEventListener("click", () => commitRow(date, fields, row));
      actions.append(rowStatus, saveBtn);
      row.append(actions);

      row._refs = { fields, stored, saveBtn, rowStatus, locked };
      paintRowStatus(date, row);
      return row;
    }

    function stateChip(result, isToday) {
      if (isToday) return chipEl("Hoje", "today");
      if (result.state === "folga") return chipEl("Folga", "folga");
      if (result.state === "falta") return chipEl("Falta", "falta");
      if (result.state === "incompleto") return chipEl("Incompleto", "incompleto");
      if (result.sunday && result.state === "porPreencher") return chipEl("Domingo", "domingo");
      return null;
    }
    function chipEl(label, cls) { const c = document.createElement("span"); c.className = `chip ${cls}`; c.textContent = label; return c; }

    function currentDraftFromFields(fields) {
      return { e1: fields.e1.value, s1: fields.s1.value, e2: fields.e2.value, s2: fields.s2.value };
    }
    function rowDirty(date, fields) {
      const stored = state._storedCache && state._storedCache[date] ? state._storedCache[date] : storedFields(date);
      const norm = v => { const n = normalizeClock(v); return n === null ? "∅" : n; };
      return norm(fields.e1.value) !== norm(stored.e1) || norm(fields.s1.value) !== norm(stored.s1)
          || norm(fields.e2.value) !== norm(stored.e2) || norm(fields.s2.value) !== norm(stored.s2);
    }
    function onFieldInput(date, fields, row) {
      state.drafts[date] = currentDraftFromFields(fields);
      // escrever limpa um estado de erro/sucesso anterior dessa linha
      if (state.rowStatus[date] && state.rowStatus[date].kind !== "saving") delete state.rowStatus[date];
      paintRowStatus(date, row);
    }
    function paintRowStatus(date, row) {
      const { saveBtn, rowStatus } = row._refs;
      const explicit = state.rowStatus[date];
      const dirty = rowDirty(date, row._refs.fields);
      saveBtn.hidden = !dirty && !(explicit && explicit.kind === "saving");
      saveBtn.disabled = state.savingDate === date;
      rowStatus.className = "rowstatus";
      if (explicit) {
        rowStatus.textContent = explicit.text;
        if (explicit.kind === "err") rowStatus.classList.add("err");
        else if (explicit.kind === "ok") rowStatus.classList.add("ok");
        else if (explicit.kind === "saving") rowStatus.classList.add("warn");
        else if (explicit.kind === "dirty") rowStatus.classList.add("warn");
        return;
      }
      if (dirty) { rowStatus.textContent = "Alterações por guardar"; rowStatus.classList.add("warn"); }
      else { rowStatus.textContent = ""; }
    }

    async function commitRow(date, fields, row) {
      state.drafts[date] = currentDraftFromFields(fields);
      state.savingDate = date;
      state.rowStatus[date] = { kind: "saving", text: "A guardar…" };
      paintRowStatus(date, row);
      const outcome = await commitDay(date);
      state.savingDate = null;
      if (outcome.ok) {
        delete state.drafts[date];
        state.rowStatus[date] = { kind: "ok", text: "Guardado ✓" };
        state.status = "Alterações guardadas na conta.";
        state.error = "";
      } else {
        state.rowStatus[date] = { kind: "err", text: outcome.error };
        state.error = outcome.error;
      }
      render();
    }

    // Grava um dia usando o rascunho; devolve {ok, error}. Mantém o mecanismo de conflito existente.
    async function commitDay(date) {
      const draft = state.drafts[date] || {};
      const clocks = [draft.e1, draft.s1, draft.e2, draft.s2].map(normalizeClock);
      if (clocks.includes(null)) return { ok: false, error: "Há uma hora inválida nesse dia." };
      const pairs = [[clocks[0], clocks[1]], [clocks[2], clocks[3]]];
      for (const [start, end] of pairs) { if ((start && !end) || (!start && end)) return { ok: false, error: "Cada período precisa de entrada e saída." }; }
      try {
        await ensureSession();
        const { day, list } = periodsOf(date);
        const now = stamp();
        let dayRecord = day;
        if (!dayRecord) {
          const id = crypto.randomUUID();
          const payload = { id, date, is_day_off: 0, is_absence: 0, sunday_unlocked: weekday(date) === 7 ? 1 : 0, notes: "", created_at: now, updated_at: now, deleted_at: null };
          await putRecord("work_days", id, payload, "");
          dayRecord = state.records.find(r => r.entity === "work_days" && r.entity_id === id);
        } else if (weekday(date) === 7 && !dayRecord.payload.sunday_unlocked) {
          const payload = { ...dayRecord.payload, sunday_unlocked: 1, updated_at: now };
          await putRecord("work_days", dayRecord.entity_id, payload, dayRecord.revision);
          dayRecord = state.records.find(r => r.entity === "work_days" && r.entity_id === dayRecord.entity_id);
        }
        for (let index = 0; index < pairs.length; index += 1) {
          const [start, end] = pairs[index];
          const existing = list[index];
          if (!start && !end) {
            if (existing) await putRecord("work_periods", existing.entity_id, { ...existing.payload, deleted_at: now, updated_at: now }, existing.revision);
            continue;
          }
          const endsNext = minuteOfDay(end) <= minuteOfDay(start) ? 1 : 0;
          if (existing) {
            const payload = { ...existing.payload, start_clock: start, end_clock: end, ends_next_day: endsNext, start_instant: lisbonInstant(date, start, 0), end_instant: lisbonInstant(date, end, endsNext), updated_at: now, deleted_at: null };
            await putRecord("work_periods", existing.entity_id, payload, existing.revision);
          } else {
            const id = crypto.randomUUID();
            const payload = { id, work_day_id: dayRecord.entity_id, start_clock: start, end_clock: end, ends_next_day: endsNext, start_instant: lisbonInstant(date, start, 0), end_instant: lisbonInstant(date, end, endsNext), created_at: now, updated_at: now, deleted_at: null };
            await putRecord("work_periods", id, payload, "");
          }
        }
        return { ok: true };
      } catch (error) {
        return { ok: false, error: error.message };
      }
    }

    /* ------- Quilómetros ------- */
    function renderKm(main) {
      const dates = monthDays(state.year, state.month);
      const prefix = `${state.year}-${String(state.month).padStart(2, "0")}`;
      const fallback = todayISO().startsWith(prefix) ? todayISO() : dates[0];
      const selected = select("Dia", dates.map(date => ({ value: date, label: date === todayISO() ? `Hoje · ${dayNumber(date)} ${weekdayName(date)}` : `${dayNumber(date)} ${weekdayName(date)}` })), fallback);
      const kilometers = input("number", "Km ao pegar na carrinha", "");
      kilometers.field.placeholder = "Ex.: 160000";
      const box = card(
        h2("Quilómetros diários"),
        p("Uma leitura por dia. O abastecimento fica nesse dia.", "muted"),
        div("row", selected.label, kilometers.label, button("Guardar leitura", "green", () => saveReading(selected.field.value, kilometers.field.value)))
      );
      const shown = dates.filter(date => byDate("mileage_readings", date).length || byDate("fuel_entries", date).length || byDate("day_notes", date).length);
      if (!shown.length) box.append(p("Ainda não há leituras deste mês na conta.", "muted"));
      else {
        box.append(div("km-head", text("Data"), text("Ao pegar na carrinha"), text("Km finais · automático"), text("Percorridos"), text("Notas do dia")));
        for (const date of shown) box.append(kmRow(date));
      }
      main.append(box);
    }
    function kmRow(date) {
      const reading = byDate("mileage_readings", date)[0];
      const next = rows("mileage_readings").map(r => r.payload).filter(i => !i.deleted_at && i.date > date).sort((a, b) => a.date.localeCompare(b.date))[0];
      const line = div("km-row");
      const metrics = div("km-metrics");
      const day = div("");
      day.append(div("km-day", text(dayNumber(date))), p(weekdayName(date), "muted"));
      metrics.append(day);
      metrics.append(text(reading ? String(reading.payload.kilometers) : "—"));
      const finals = div("");
      if (reading && next && Number(next.kilometers) >= Number(reading.payload.kilometers)) {
        const distance = Number(next.kilometers) - Number(reading.payload.kilometers);
        finals.append(div("km-final", text(groupKm(next.kilometers))), p(`Leitura de ${next.date.split("-").reverse().join("/")}`, "muted"));
        metrics.append(finals, div("km-final", text(`${distance} km`)));
      } else if (reading && next) {
        finals.append(p("Leitura a descer. Não entra na distância.", "muted"));
        metrics.append(finals, text("—"));
      } else if (reading) {
        finals.append(p("A aguardar próxima leitura", "muted"));
        metrics.append(finals, text("—"));
      } else { metrics.append(text("—"), text("—")); }
      const notes = div("span");
      const noteRows = byDate("day_notes", date);
      const fuels = byDate("fuel_entries", date);
      if (!noteRows.length && !fuels.length) notes.append(p("Sem notas", "muted"));
      for (const note of noteRows) notes.append(text(note.payload.body || ""));
      for (const fuel of fuels) notes.append(fuelCard(fuel));
      const liters = input("text", "Litros", "");
      const pump = input("text", "Valor por litro €/L", "");
      const paid = input("text", "Valor pago € (com desconto)", "");
      const odometer = input("number", "Conta-quilómetros", reading ? String(reading.payload.kilometers) : "");
      notes.append(div("row", liters.label, pump.label, paid.label, odometer.label, button("Abastecimento", "plain", () => saveFuel(date, odometer.field.value, liters.field.value, paid.field.value, pump.field.value))));
      metrics.append(notes);
      line.append(metrics);
      return line;
    }
    function groupKm(value) { return String(value).replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
    function fuelCard(record) {
      const fuel = record.payload;
      const box = div("fuel");
      const parts = [];
      if (fuel.liters_milli != null) parts.push(`${formatMilli(fuel.liters_milli)} L`);
      if (fuel.pump_milli != null) parts.push(`${formatMilli(fuel.pump_milli)} €/L`);
      if (!parts.length) parts.push(`${fuel.odometer_km} km`);
      box.append(p("Abastecimento — " + parts.join(" · "), "ftitle"));
      const gross = fuel.liters_milli != null && fuel.pump_milli != null ? Math.round((fuel.liters_milli * fuel.pump_milli + 5000) / 10000) : null;
      const detail = [];
      if (gross != null) detail.push(`Valor final: ${formatCents(gross)}`);
      if (fuel.paid_cents != null) detail.push(`Pago: ${formatCents(fuel.paid_cents)}`);
      if (gross != null && fuel.paid_cents != null) { const d = gross - fuel.paid_cents; detail.push(d >= 0 ? `Desconto: ${formatCents(d)}` : `Acima da bomba: ${formatCents(-d)}`); }
      if (fuel.liters_milli && fuel.paid_cents != null) detail.push(`Efetivo: ${formatMilli(Math.round((fuel.paid_cents * 10000 + fuel.liters_milli / 2) / fuel.liters_milli))} €/L`);
      if (fuel.tank_full) detail.push("Depósito cheio");
      if (detail.length) box.append(p(detail.join(" · "), "muted"));
      box.append(button("Eliminar", "danger", () => removeFuel(record)));
      return box;
    }
    async function saveReading(date, kilometers) {
      const value = Number(kilometers);
      if (!date || !Number.isInteger(value) || value < 0) { state.error = "A leitura tem de ser um número inteiro. Zero é válido."; render(); return; }
      try {
        await ensureSession();
        const existing = byDate("mileage_readings", date)[0];
        const now = stamp();
        if (existing) await putRecord("mileage_readings", existing.entity_id, { ...existing.payload, kilometers: value, updated_at: now, deleted_at: null }, existing.revision);
        else { const id = crypto.randomUUID(); await putRecord("mileage_readings", id, { id, date, kilometers: value, created_at: now, updated_at: now, deleted_at: null }, ""); }
        state.error = ""; state.status = "Alterações guardadas na conta.";
      } catch (error) { state.error = error.message; }
      render();
    }
    async function saveFuel(date, odometer, liters, paid, pump) {
      const km = Number(odometer);
      if (!Number.isInteger(km)) { state.error = "O conta-quilómetros tem de ser um número inteiro."; render(); return; }
      try {
        await ensureSession();
        const now = stamp();
        const id = crypto.randomUUID();
        const litersMilli = milli(liters, 1000);
        const paidCents = milli(paid, 100);
        const effective = litersMilli && paidCents != null ? Math.round((paidCents * 10000 + litersMilli / 2) / litersMilli) : null;
        await putRecord("fuel_entries", id, { id, date, clock: null, odometer_km: km, liters_milli: litersMilli, pump_milli: milli(pump, 1000), discounted_milli: effective, paid_cents: paidCents, paid_is_manual: 1, tank_full: 1, created_at: now, updated_at: now, deleted_at: null }, "");
        state.error = ""; state.status = "Alterações guardadas na conta.";
      } catch (error) { state.error = error.message; }
      render();
    }
    async function removeFuel(record) {
      try {
        await ensureSession();
        const now = stamp();
        await putRecord("fuel_entries", record.entity_id, { ...record.payload, deleted_at: now, updated_at: now }, record.revision);
        state.status = "Alterações guardadas na conta."; state.error = "";
      } catch (error) { state.error = error.message; }
      render();
    }

    async function refresh() {
      try {
        await loadRecords();
        state.error = "";
        state.status = state.records.length ? "Dados carregados da conta." : "A conta ainda não tem registos. No iPhone, entra com este email e sincroniza.";
      } catch (error) {
        state.error = error.message;
        if (String(error.message).includes("sessão")) saveSession(null);
      }
      render();
    }
    function signOut() { saveSession(null); state.records = []; state.status = ""; state.error = ""; state.drafts = {}; state.rowStatus = {}; render(); }

    /* ------- tempo e números ------- */
    function isCurrentMonth() { const now = todayISO(); return Number(now.slice(0, 4)) === state.year && Number(now.slice(5, 7)) === state.month; }
    function lisbonInstant(iso, clock, plusDays) {
      const [year, month, day] = iso.split("-").map(Number);
      const [hour, minute] = clock.split(":").map(Number);
      const utcGuess = new Date(Date.UTC(year, month - 1, day + plusDays, hour, minute, 0));
      const offset = lisbonOffset(utcGuess);
      return new Date(utcGuess.getTime() - offset).toISOString().replace(/\.\d{3}Z$/, "Z");
    }
    function lisbonOffset(date) {
      const name = new Intl.DateTimeFormat("en-US", { timeZone: "Europe/Lisbon", timeZoneName: "shortOffset" }).formatToParts(date).find(p => p.type === "timeZoneName")?.value || "GMT";
      const match = name.match(/GMT([+-])(\d{1,2})(?::(\d{2}))?/);
      if (!match) return 0;
      const sign = match[1] === "-" ? -1 : 1;
      return sign * (Number(match[2]) * 60 + Number(match[3] || 0)) * 60000;
    }
    function milli(t, scale) { const v = String(t || "").trim().replace(",", "."); if (!v) return null; const n = Number(v); if (!Number.isFinite(n)) return null; return Math.round(n * scale); }
    function formatMilli(v) { return `${Math.trunc(v / 1000)},${String(Math.abs(v % 1000)).padStart(3, "0")}`; }
    function formatCents(v) { return `${Math.trunc(v / 100)},${String(Math.abs(v % 100)).padStart(2, "0")} €`; }

    /* ------- DOM helpers ------- */
    function el(tag, textContent) { const e = document.createElement(tag); if (textContent != null) e.textContent = textContent; return e; }
    function card(...nodes) { const e = el("section"); e.className = "card"; e.append(...nodes.flat()); return e; }
    function h2(v) { return el("h2", v); }
    function p(v, className) { const e = el("p"); e.textContent = v; if (className) e.className = className; return e; }
    function text(v, className) { return p(v, className); }
    function div(className, ...nodes) { const e = el("div"); if (className) e.className = className; e.append(...nodes.flat()); return e; }
    function spanIcon(ch) { const s = el("span", ch); s.className = "ic"; return s; }
    function iconButton(label, action) { const b = el("button", label); b.className = "iconbtn"; b.type = "button"; b.addEventListener("click", action); return b; }
    function button(title, className, action, pressed) {
      const b = el("button", title); b.type = "button"; b.className = className;
      if (pressed) b.setAttribute("aria-pressed", "true");
      b.addEventListener("click", action); return b;
    }
    function button2(title, action, pressed) { const b = el("button", title); b.type = "button"; if (pressed) b.setAttribute("aria-pressed", "true"); b.addEventListener("click", action); return b; }
    function select(title, options, value) {
      const field = el("select");
      for (const o of options) { const op = el("option", o.label); op.value = o.value; field.append(op); }
      field.value = value || "";
      const label = el("label"); label.className = "field"; label.append(document.createTextNode(title), field);
      return { label, field };
    }
    function input(type, title, value) {
      const field = el("input"); field.type = type; field.value = value || "";
      if (type === "number") field.inputMode = "numeric";
      const label = el("label"); label.className = "field"; label.append(document.createTextNode(title), field);
      return { label, field };
    }

    if (state.session) refresh(); else render();
  </script>
</body>
</html>
